name: Python CI

on:
  push:
  pull_request:

jobs:
  style:
    name: Style Check (pre-commit)
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3
        - name: Set up uv
          uses: astral-sh/setup-uv@v6
          with:
            python-version: "3.11"
        - name: Run pre-commit
          run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Run Tests (pytest)
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3
        - name: Set up uv
          uses: astral-sh/setup-uv@v6
          with:
            python-version: "3.11"
        - name: Install project and dev dependencies
          run: uv sync --locked
        - name: Run pytest
          run: uv run pytest tests

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [test, style]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
