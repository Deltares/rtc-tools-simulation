name: Python CI

on:
  push:
  pull_request:

jobs:
  style:
    name: Style Check (pre-commit)
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        - name: Set up uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
          with:
            python-version: "3.11"
            version: "0.13.5"
        - name: Run pre-commit
          run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Run Tests (pytest)
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        - name: Set up uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
          with:
            python-version: "3.11"
            version: "0.13.5"
        - name: Install project and dev dependencies
          run: uv sync --locked
        - name: Run pytest
          run: uv run pytest tests

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [test, style]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"
          version: "0.13.5"
          enable-cache: false
      - name: Build
        run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
