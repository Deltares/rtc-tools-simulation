[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rtc-tools-simulation"
dynamic = ["version"]
authors = [
    {name = "Deltares"}
]
description = "Extension for building models used for simulation in rtc-tools."
readme = "README.md"
requires-python = ">=3.11"

dependencies=[
"casadi >=3.6.3,<=3.7,!=3.6.6",
"Jinja2 >=3.1.6",
"numpy",
"pandas",
"pydantic",
"rtc-tools >=2.7.0,<3",
"rtc-tools-interface >= 0.9",
]

[project.scripts]
rtc-tools-reservoir-template = "rtctools_simulation.cli.reservoir:create_reservoir_template"

[dependency-groups]
dev = [
"pytest >=8.2.0",
"pyzsf",
"fonttools >=4.60.2"
]
docs = [
"sphinx >= 7.0.0",
"sphinx_rtd_theme >= 1.3.0",
"matplotlib >= 3.7.0",
]

[tool.ruff]
line-length = 100
select = [
    # For an overview of options; see https://docs.astral.sh/ruff/rules
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "E",  # default / pycodestyle
    "F",  # default / pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "PL", # pylint 
    "W",  # pycodestyle
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["rtctools_simulation"]
include = [
  "/COPYING.LESSER",
  "/README.md",
]
